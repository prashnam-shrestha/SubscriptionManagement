name: subscriptionos

services:
  postgres:
    image: postgres:17
    container_name: subscriptionos-postgres
    restart: always
    environment:
      POSTGRES_DB: subscriptionos_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: subscriptionos-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
